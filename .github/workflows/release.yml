name: Build Windows app

# Push a version tag (git tag -a v2.3.0 -m "..." && git push origin v2.3.0) to build,
# optionally sign, and publish a GitHub release. "Run workflow" by hand builds a test
# .exe (downloadable from the run's Artifacts) without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release
  actions: read     # SignPath reads the unsigned artifact

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = python -c "import aethernode; print(aethernode.__version__)"
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != app version v$ver (update aethernode/__init__.py)" }

      - name: Build AetherNode.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@v5
        with:
          name: AetherNode-unsigned
          path: dist/AetherNode.exe
          if-no-files-found: error

      # ---- Code signing (SignPath Foundation, free for open source) ----------------
      # Off until the project is approved. To turn it on, add in the repo settings:
      #   Secrets -> SIGNPATH_API_TOKEN
      #   Variables -> SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #                SIGNPATH_SIGNING_POLICY_SLUG (e.g. release-signing)
      # and check the step's inputs against SignPath's current docs.
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = if (Test-Path signed\AetherNode.exe) { "signed\AetherNode.exe" } else { "dist\AetherNode.exe" }
          Copy-Item $exe release\AetherNode.exe
          $hash = (Get-FileHash release\AetherNode.exe -Algorithm SHA256).Hash
          "$hash  AetherNode.exe" | Out-File -Encoding ascii release\SHA256SUMS.txt
          $signed = if ($exe -like "signed*") { "yes" } else { "no" }
          "SIGNED=$signed" >> $env:GITHUB_ENV
          "SHA256=$hash" >> $env:GITHUB_ENV
          Write-Host "Signed: $signed   SHA-256: $hash"

      - name: Upload release files
        uses: actions/upload-artifact@v5
        with:
          name: AetherNode-release
          path: release/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $warn = if ($env:SIGNED -eq "yes") {
            "Code-signed. Windows may still show a SmartScreen notice for a new release until it builds reputation."
          } else {
            "Not code-signed yet: if Windows shows *Windows protected your PC*, click **More info -> Run anyway**."
          }
          $notes = @"
          **Download:** [AetherNode.exe](https://github.com/$repo/releases/download/$tag/AetherNode.exe) for Windows 10/11, 64-bit

          Double-click it: the dashboard opens in your browser and AetherNode runs in the system tray, by the clock. $warn

          SHA-256: ``$env:SHA256``

          Built automatically by GitHub Actions from commit ${{ github.sha }} ([build log](https://github.com/$repo/actions/runs/${{ github.run_id }})).
          "@
          $notes | Out-File -Encoding utf8 notes.md
          gh release create $tag release/AetherNode.exe release/SHA256SUMS.txt --title "AetherNode $tag" --notes-file notes.md --verify-tag
